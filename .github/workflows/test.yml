name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

# Fast checks for configuration rendering and shell loading.
# bootstrap.yml runs the full install when toolchain inputs change.
jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Install chezmoi
        run: |
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"

      - name: Seed non-interactive identity
        run: |
          mkdir -p "$HOME/.config/chezmoi"
          printf '[data]\n  name = "CI"\n  email = "ci@example.com"\n' \
            > "$HOME/.config/chezmoi/chezmoi.toml"

      - name: Test Context7 setup and local leak checks
        run: python3 tests/test-context7.py

      - name: Test shared agent instructions
        run: python3 tests/test-agent-instructions.py

      - name: Test bootstrap and editor installers
        run: python3 tests/test-installers.py

      - name: Apply dotfiles
        run: |
          "$HOME/.local/bin/chezmoi" init --source "$PWD" --apply

      - name: Syntax check
        run: zsh -n "$HOME/.zshrc"

      - name: Load test with applied Oh My Zsh and plugins
        run: |
          test_dir="$(mktemp -d)"
          ln -s "$HOME/.zshrc" "$test_dir/.zshrc"
          ZDOTDIR="$test_dir" zsh -i -c 'echo "zshrc load OK"'
